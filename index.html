<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trading Journal</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- Installable app (Add to Home Screen on iPhone, Install in Chrome) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121211">
  <link rel="stylesheet" href="styles.css?v=2026-10-06.2">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">Trading Journal<small>Discipline over outcome</small></div>
      <nav class="top" aria-label="Main">
        <button data-go="dashboard">Dashboard</button>
        <button data-go="trades">Trades</button>
        <button data-go="journal">Daily journal</button>
        <button data-go="todo">To-do</button>
        <button data-go="weekly">Weekly review</button>
        <button data-go="calendar">Calendar</button>
        <button data-go="news">News</button>
      </nav>
      <div class="top-controls">
        <button class="sync-pill" id="sync-pill" hidden></button>
        <div class="seg acct-switch" id="acct" role="tablist" aria-label="Account">
          <button data-acct="live" role="tab">Real money</button>
          <button data-acct="paper" role="tab">Paper</button>
        </div>
        <select id="mkt" aria-label="Markets">
          <option value="all">All markets</option>
          <option value="forex">Forex</option>
          <option value="stocks">Stocks &amp; options</option>
          <option value="indices">Indices &amp; futures</option>
        </select>
        <button class="btn primary" id="top-log">+ Log trade</button>
      </div>
    </div>
    <div id="acct-banner" class="acct-banner" hidden>Paper trading<span class="banner-more">: simulated money. These trades are kept separate from your real-money stats.</span></div>
  </header>
  <div class="app">
    <nav class="side" aria-label="Tools">
      <div class="side-label">Tools</div>
      <button data-go="rules">Rules and mistakes</button>
      <button data-go="notes">GoodNotes</button>
      <button data-go="coach">AI coach</button>
      <div class="spacer"></div>
      <button data-go="settings">Settings</button>
    </nav>
    <div class="content">
      <main id="main"></main>
    </div>
  </div>

  <!-- Phone layout: bottom tab bar + "More" sheet (hidden on wider screens) -->
  <nav class="tabbar" aria-label="Main">
    <button data-go="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg><span>Home</span></button>
    <button data-go="trades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg><span>Trades</span></button>
    <button class="tab-log" id="tab-log" aria-label="Log a trade"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-go="todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l2 2 3.5-3.5M4 14.5l2 2 3.5-3.5M13 7h7M13 15h7"/></svg><span>To-do</span></button>
    <button id="tab-more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span></button>
  </nav>
  <div class="sheet" id="more-sheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="More">
      <div class="sheet-grab"></div>
      <div class="sheet-controls">
        <div class="seg acct-switch" id="acct-m" role="tablist" aria-label="Account">
          <button data-acct="live" role="tab">Real money</button>
          <button data-acct="paper" role="tab">Paper</button>
        </div>
        <select id="mkt-m" aria-label="Markets">
          <option value="all">All markets</option>
          <option value="forex">Forex</option>
          <option value="stocks">Stocks &amp; options</option>
          <option value="indices">Indices &amp; futures</option>
        </select>
      </div>
      <div class="sheet-list">
        <button data-go="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h10l3 3v13H6zM9 10h7M9 14h7M9 18h4"/></svg><span>Daily journal</span></button>
        <button data-go="weekly"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg><span>Weekly review</span></button>
        <button data-go="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 14h2M12 14h2M16 14h2"/></svg><span>Calendar</span></button>
        <button data-go="news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7"/></svg><span>News</span></button>
        <button data-go="rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5l2 2 3.5-3.5M5 14.5l2 2 3.5-3.5M13 7h6M13 15h6"/></svg><span>Rules and mistakes</span></button>
        <button data-go="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l5 5-11 11H4v-5zM12 7l5 5"/></svg><span>GoodNotes</span></button>
        <button data-go="coach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9.5l-4.2 1.9L12 16l-1.8-4.6L6 9.5l4.2-1.9zM18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>AI coach</span></button>
        <button data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></button>
      </div>

    </div>
  </div>
  <script src="db.js?v=2026-10-06.2"></script>
  <script src="charts.js?v=2026-10-06.2"></script>
  <script src="coach.js?v=2026-10-06.2"></script>
  <script src="notes.js?v=2026-10-06.2"></script>
  <script src="calendar.js?v=2026-10-06.2"></script>
  <script src="news.js?v=2026-10-06.2"></script>
  <script src="todo.js?v=2026-10-06.2"></script>
  <script src="sync.js?v=2026-10-06.2"></script>
  <script src="live.js?v=2026-10-06.2"></script>
  <script src="app.js?v=2026-10-06.2"></script>
</body>
</html>
